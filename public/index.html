<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAI 账号等级批量查询</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #58a6ff;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .wrap { max-width: 1000px; margin: 0 auto; }

    /* Header */
    .hdr { margin-bottom: 28px; }
    .hdr h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .hdr p { color: var(--text-muted); font-size: 13px; }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 10px 12px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
      transition: border-color .15s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--text-muted); }

    /* Controls row */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
    }

    .label-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .label-inline input[type=number] {
      width: 56px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 4px 8px;
      outline: none;
      text-align: center;
    }

    .spacer { flex: 1; }

    .hint { color: var(--text-muted); font-size: 12px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2ea043; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-xs {
      padding: 3px 9px;
      font-size: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-xs:hover { border-color: #6e7681; color: var(--text); }

    /* Progress */
    .prog-wrap { display: none; }
    .prog-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .prog-track {
      background: var(--bg);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
    }
    .prog-bar {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #238636, #58a6ff);
      transition: width .25s;
    }

    /* Summary grid */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .summ-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .summ-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; margin-bottom: 4px; }
    .summ-count { font-size: 30px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .summ-sub { font-size: 11px; color: var(--text-muted); }

    /* Tier group */
    .tg { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .tg-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      background: var(--surface2);
      transition: background .1s;
    }
    .tg-hdr:hover { background: #21262d; }
    .tg-badge {
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .tg-title { font-weight: 600; }
    .tg-count { font-size: 12px; color: var(--text-muted); }
    .tg-spacer { flex: 1; }
    .tg-body { }

    .key-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .key-mono { font-family: monospace; color: #a5d6ff; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .key-stat { color: var(--text-muted); white-space: nowrap; }
    .key-err  { color: #f85149; }

    /* Export row */
    .export-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface2);
      border: 1px solid #58a6ff66;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Tier palette */
    .T1 { color: #79c0ff; border-color: #1f6feb; background: #0d2840; }
    .T2 { color: #56d364; border-color: #1a7f37; background: #0d2b1a; }
    .T3 { color: #e3b341; border-color: #9e6a03; background: #2b1e00; }
    .T4 { color: #bc8cff; border-color: #6e40c9; background: #1a0e2e; }
    .T5 { color: #ff7b72; border-color: #b62324; background: #2b0d0e; }
    .INVALID { color: #f85149; border-color: #6e1c1c; background: #2b0c0c; }
    .ERROR   { color: #7d8590; border-color: #30363d; background: #1c2128; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <h1>OpenAI 账号等级批量查询</h1>
    <p>通过 gpt-4o 响应头 <code>x-ratelimit-limit-tokens</code> 判断账号等级 (T1–T5)，每次查询消耗极少 token</p>
  </div>

  <!-- Input -->
  <div class="card">
    <div class="card-title">API Keys — 每行一个</div>
    <textarea id="keys" placeholder="sk-proj-...&#10;sk-proj-...&#10;sk-proj-..."></textarea>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="startCheck()">▶ 开始查询</button>
      <button class="btn btn-ghost" onclick="clearAll()">清空</button>
      <div class="label-inline">
        并发数
        <input type="number" id="concur" value="5" min="1" max="20" />
      </div>
      <div class="spacer"></div>
      <span class="hint" id="keyCount">0 个 Key</span>
    </div>
  </div>

  <!-- Progress -->
  <div class="card prog-wrap" id="progWrap">
    <div class="prog-row">
      <span id="progLabel">正在查询…</span>
      <span id="progFrac">0 / 0</span>
    </div>
    <div class="prog-track">
      <div class="prog-bar" id="progBar" style="width:0%"></div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" style="display:none">
    <div class="summary-grid" id="summGrid"></div>
    <div id="tierGroups"></div>
    <div class="export-row">
      <button class="btn btn-ghost" onclick="exportCSV()">↓ CSV</button>
      <button class="btn btn-ghost" onclick="exportJSON()">↓ JSON</button>
      <button class="btn btn-ghost" onclick="copyAll()">⎘ 复制全部 Key（含等级）</button>
    </div>
  </div>

</div><!-- /wrap -->

<div class="toast" id="toast"></div>

<script>
// ── Tier definitions ────────────────────────────────────────────
const TIER_DEFS = [
  { name: 'T1', max: 30_000,      label: '30K  tokens/min' },
  { name: 'T2', max: 450_000,     label: '450K tokens/min' },
  { name: 'T3', max: 800_000,     label: '800K tokens/min' },
  { name: 'T4', max: 2_000_000,   label: '2M   tokens/min' },
  { name: 'T5', max: Infinity,    label: '30M  tokens/min' },
];

function getTierName(limitTokens) {
  for (const t of TIER_DEFS) {
    if (limitTokens <= t.max) return t.name;
  }
  return 'T5';
}

function fmtTokens(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(0) + 'K';
  return String(n);
}

function maskKey(k) {
  if (k.length <= 16) return k;
  return k.slice(0, 10) + '···' + k.slice(-8);
}

// ── Counter ──────────────────────────────────────────────────────
const keysTA = document.getElementById('keys');
const keyCountEl = document.getElementById('keyCount');
keysTA.addEventListener('input', updateCount);

function getKeys() {
  return keysTA.value.split('\n').map(s => s.trim()).filter(Boolean);
}
function updateCount() {
  const n = getKeys().length;
  keyCountEl.textContent = `${n} 个 Key`;
}

// ── Core check ───────────────────────────────────────────────────
async function checkKey(apiKey) {
  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey }),
    });
    const data = await res.json();

    if (data.error) return { key: apiKey, group: 'ERROR', msg: data.error };

    const { httpStatus, limitTokens } = data;

    if (httpStatus === 401) return { key: apiKey, group: 'INVALID', msg: '无效 Key' };

    if (limitTokens === null) {
      return { key: apiKey, group: 'ERROR', msg: `HTTP ${httpStatus}，未获取到限额头` };
    }

    const tierName = getTierName(limitTokens);
    return { key: apiKey, group: tierName, limitTokens, httpStatus };
  } catch (e) {
    return { key: apiKey, group: 'ERROR', msg: e.message };
  }
}

// ── Concurrency runner ───────────────────────────────────────────
async function runConcurrent(items, concur, onDone) {
  const results = new Array(items.length);
  let next = 0;
  let finished = 0;

  async function worker() {
    while (next < items.length) {
      const i = next++;
      results[i] = await items[i]();
      finished++;
      onDone(finished, items.length, results[i]);
    }
  }

  await Promise.all(
    Array.from({ length: Math.min(concur, items.length) }, () => worker())
  );
  return results;
}

// ── UI helpers ───────────────────────────────────────────────────
let allResults = [];

function updateProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progFrac').textContent = `${done} / ${total}`;
  document.getElementById('progLabel').textContent = done < total
    ? `正在查询… (${pct}%)`
    : '查询完成 ✓';
}

// ── Main entry ───────────────────────────────────────────────────
async function startCheck() {
  const keys = getKeys();
  if (!keys.length) { toast('请输入至少一个 API Key'); return; }

  const concur = Math.max(1, Math.min(20, parseInt(document.getElementById('concur').value) || 5));

  // Reset
  allResults = [];
  document.getElementById('startBtn').disabled = true;
  document.getElementById('progWrap').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  updateProgress(0, keys.length);

  const tasks = keys.map(k => () => checkKey(k));

  allResults = await runConcurrent(tasks, concur, (done, total, result) => {
    updateProgress(done, total);
    // Live-append to UI
    appendResult(result);
  });

  document.getElementById('startBtn').disabled = false;
  finalizeResults();
}

// ── Render ───────────────────────────────────────────────────────
const GROUP_ORDER = ['T5', 'T4', 'T3', 'T2', 'T1', 'INVALID', 'ERROR'];

function appendResult(r) {
  // Show results section on first result
  const resultsEl = document.getElementById('results');
  if (resultsEl.style.display === 'none') resultsEl.style.display = 'block';

  // Find or create group
  let tgEl = document.getElementById('tg-' + r.group);
  if (!tgEl) {
    tgEl = createTierGroup(r.group);
    insertGroupInOrder(tgEl, r.group);
  }

  const body = tgEl.querySelector('.tg-body');
  body.appendChild(makeKeyRow(r));

  // Update count badge
  const countEl = tgEl.querySelector('.tg-count');
  countEl.textContent = body.children.length + ' 个';

  refreshSummary();
}

function createTierGroup(group) {
  const label = TIER_DEFS.find(t => t.name === group)?.label || group;
  const div = document.createElement('div');
  div.className = 'tg';
  div.id = 'tg-' + group;
  div.innerHTML = `
    <div class="tg-hdr" onclick="toggleBody('${group}')">
      <span class="tg-badge ${group}">${group}</span>
      <span class="tg-title">${label}</span>
      <span class="tg-count">0 个</span>
      <span class="tg-spacer"></span>
      <button class="btn-xs" onclick="event.stopPropagation();copyGroup('${group}')">复制此组</button>
    </div>
    <div class="tg-body" id="tbody-${group}"></div>
  `;
  return div;
}

function insertGroupInOrder(el, group) {
  const container = document.getElementById('tierGroups');
  const myIdx = GROUP_ORDER.indexOf(group);
  let inserted = false;

  for (const child of container.children) {
    const childGroup = child.id.replace('tg-', '');
    if (GROUP_ORDER.indexOf(childGroup) > myIdx) {
      container.insertBefore(el, child);
      inserted = true;
      break;
    }
  }
  if (!inserted) container.appendChild(el);
}

function makeKeyRow(r) {
  const row = document.createElement('div');
  row.className = 'key-row';

  const keySpan = `<span class="key-mono" title="${r.key}">${maskKey(r.key)}</span>`;

  let info = '';
  if (r.limitTokens != null) {
    info = `<span class="key-stat">${fmtTokens(r.limitTokens)} tokens/min</span>`;
  } else if (r.msg) {
    info = `<span class="key-err">${r.msg}</span>`;
  }

  row.innerHTML = `${keySpan}${info}<button class="btn-xs" onclick="copyKey(this,'${r.key.replace(/'/g, "\\'")}')">复制</button>`;
  return row;
}

function refreshSummary() {
  const groups = {};
  for (const r of allResults) {
    groups[r.group] = (groups[r.group] || 0) + 1;
  }

  const grid = document.getElementById('summGrid');
  grid.innerHTML = '';

  for (const g of GROUP_ORDER) {
    if (!groups[g]) continue;
    const label = TIER_DEFS.find(t => t.name === g)?.label || g;
    const card = document.createElement('div');
    card.className = 'summ-card';
    card.innerHTML = `
      <div class="summ-label" style="color:var(--t${g.toLowerCase()},#7d8590)">${g}</div>
      <div class="summ-count">${groups[g]}</div>
      <div class="summ-sub">${label}</div>
    `;
    // inject color via inline style on label
    const lbl = card.querySelector('.summ-label');
    lbl.className = 'summ-label tg-badge ' + g;
    lbl.style.display = 'inline-block';
    lbl.style.marginBottom = '6px';
    grid.appendChild(card);
  }
}

function finalizeResults() {
  refreshSummary();
}

function toggleBody(group) {
  const body = document.getElementById('tbody-' + group);
  if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
}

// ── Copy / Export ─────────────────────────────────────────────────
async function copyKey(btn, key) {
  await copyText(key);
  const orig = btn.textContent;
  btn.textContent = '✓';
  setTimeout(() => btn.textContent = orig, 1200);
}

function copyGroup(group) {
  const keys = allResults.filter(r => r.group === group).map(r => r.key).join('\n');
  copyText(keys);
  toast(`已复制 ${group} 的全部 Key`);
}

function copyAll() {
  const lines = allResults.map(r =>
    `${r.key}\t${r.group}\t${r.limitTokens != null ? fmtTokens(r.limitTokens) : ''}\t${r.msg || ''}`
  );
  copyText(lines.join('\n'));
  toast('已复制全部结果');
}

function exportCSV() {
  const header = 'Key,等级,Tokens/min 上限,HTTP状态,备注';
  const rows = allResults.map(r =>
    `"${r.key}","${r.group}","${r.limitTokens != null ? fmtTokens(r.limitTokens) : ''}","${r.httpStatus || ''}","${r.msg || ''}"`
  );
  dl([header, ...rows].join('\n'), 'openai-tiers.csv', 'text/csv;charset=utf-8;');
}

function exportJSON() {
  dl(JSON.stringify(allResults, null, 2), 'openai-tiers.json', 'application/json');
}

function dl(content, name, type) {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([content], { type })),
    download: name,
  });
  a.click();
  URL.revokeObjectURL(a.href);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { /* fallback */ const t = Object.assign(document.createElement('textarea'),{value:text,style:'position:fixed;opacity:0'}); document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
}

// ── Toast ─────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

function clearAll() {
  keysTA.value = '';
  allResults = [];
  updateCount();
  document.getElementById('progWrap').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('summGrid').innerHTML = '';
  document.getElementById('tierGroups').innerHTML = '';
}

updateCount();
</script>
</body>
</html>
